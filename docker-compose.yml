version: "3.8"

services:
  openhead:
    image: ghcr.io/krtvysinghh/openhead:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openhead-office
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
