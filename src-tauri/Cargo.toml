[package]
name = "openhead-desktop"
version = "1.0.0"
description = "Openhead Office Suite - Sovereign, Local-First Office Suite"
authors = ["Openhead Core Team"]
license = "MIT"
repository = "https://github.com/krtvysinghh/Openhead"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
