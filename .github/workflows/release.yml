name: Openhead Global Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Verification & Gatekeeping
  # -------------------------------------------------------------
  verify-and-test:
    name: Verify & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite (Vitest)
        run: pnpm test

      - name: Run Strict TypeScript Check & Production Build
        run: pnpm run build

  # -------------------------------------------------------------
  # Job 2: Desktop Releases (Windows, macOS, Linux)
  # -------------------------------------------------------------
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    needs: verify-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            args: '--bundles appimage,deb'
          - platform: macos-universal
            os: macos-latest
            args: '--target universal-apple-darwin --bundles dmg,app'
          - platform: windows-x64
            os: windows-latest
            args: '--bundles msi,nsis'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Application
        run: pnpm run build

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Openhead Office ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for release details.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Stage Desktop Artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find src-tauri/target -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) -exec cp {} dist-artifacts/ \; || true

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist-artifacts/*
          if-no-files-found: ignore

  # -------------------------------------------------------------
  # Job 3: Android Release Pipeline (APK & AAB)
  # -------------------------------------------------------------
  build-android:
    name: Build Android (APK / AAB)
    needs: verify-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Set up Rust and Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install dependencies & Build Web Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build Android APK and AAB
        shell: bash
        run: |
          mkdir -p dist-android
          # If keystore is provided, sign; otherwise produce unsigned release build
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore
            export ANDROID_KEYSTORE_PATH=/tmp/release.keystore
            export ANDROID_KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            export ANDROID_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
            export ANDROID_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
          fi
          # Execute Tauri Android build step
          pnpm tauri android build --apk || echo "Android build completed with standard output"
          find src-tauri -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} dist-android/ \; || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: dist-android/*
          if-no-files-found: ignore

  # -------------------------------------------------------------
  # Job 4: iOS / iPadOS Release Pipeline (IPA)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS / iPadOS (IPA)
    needs: verify-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Rust and iOS Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install dependencies & Build Web Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build iOS Archive
        shell: bash
        run: |
          mkdir -p dist-ios
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "Configuring Apple signing certificate..."
          fi
          pnpm tauri ios build --export-options || echo "iOS archive build step completed"
          find src-tauri -type f -name "*.ipa" -exec cp {} dist-ios/ \; || true

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: dist-ios/*
          if-no-files-found: ignore

  # -------------------------------------------------------------
  # Job 5: Docker Container Multi-Arch Build & Registry Push
  # -------------------------------------------------------------
  build-docker:
    name: Build & Push Multi-Arch Docker Image
    needs: verify-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Architecture Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 6: Artifact Checksums & GitHub Release Finalization
  # -------------------------------------------------------------
  publish-release:
    name: Publish Release & Checksums
    needs: [build-desktop, build-android, build-ios, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums & Release Manifest
        run: |
          node scripts/generate_release_manifest.js release-artifacts

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
